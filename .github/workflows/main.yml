name: Deploy Spok Digital to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build Next.js app
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: "file:./dev.db"

      - name: Create deployment package
        run: |
          # Create deployment directory structure
          mkdir -p deploy

          # Copy essential files for Next.js production
          cp -r .next deploy/
          cp -r public deploy/
          cp package*.json deploy/
          cp next.config.ts deploy/

          # Copy source files that Next.js might need at runtime
          [ -d "app" ] && cp -r app deploy/ || echo "No app directory"
          [ -d "components" ] && cp -r components deploy/ || echo "No components directory"
          [ -d "lib" ] && cp -r lib deploy/ || echo "No lib directory"
          [ -d "prisma" ] && cp -r prisma deploy/ || echo "No prisma directory"
          [ -f "components.json" ] && cp components.json deploy/ || echo "No components.json"
          [ -f "tailwind.config.ts" ] && cp tailwind.config.ts deploy/ || echo "No tailwind.config.ts"
          [ -f "postcss.config.mjs" ] && cp postcss.config.mjs deploy/ || echo "No postcss.config.mjs"
          [ -f "tsconfig.json" ] && cp tsconfig.json deploy/ || echo "No tsconfig.json"

          # Never ship local data: the server's copies must stay untouched
          rm -rf deploy/public/uploads
          rm -f deploy/prisma/dev.db deploy/prisma/dev.db-journal

          # Create production package
          tar -czf spok-digital-deployment.tar.gz -C deploy .

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            APP_NAME="spok-digital"
            DEPLOY_PATH="/home/gulfcart/spok-digital"
            BACKUP_DIR="$DEPLOY_PATH/backups"

            sudo mkdir -p $DEPLOY_PATH
            sudo chown $USER:$USER $DEPLOY_PATH
            mkdir -p $BACKUP_DIR

            pm2 stop $APP_NAME 2>/dev/null || echo "Process not running"
            pm2 delete $APP_NAME 2>/dev/null || echo "Process not found"

            mkdir -p $DEPLOY_PATH/current
            cd $DEPLOY_PATH/current

            # Back up the database (timestamped copy + a "latest" copy)
            if [ -f prisma/dev.db ]; then
              STAMP=$(date +%Y%m%d-%H%M%S)
              cp prisma/dev.db $BACKUP_DIR/dev.db.$STAMP
              cp prisma/dev.db $BACKUP_DIR/dev.db.latest
              echo "Database backed up: dev.db.$STAMP"
            else
              echo "No database yet"
            fi

            # Keep only the 10 most recent timestamped database backups
            ls -1t $BACKUP_DIR/dev.db.2* 2>/dev/null | tail -n +11 | xargs -r rm -f

            # Back up uploads (latest mirror only)
            if [ -d public/uploads ] && [ "$(ls -A public/uploads 2>/dev/null)" ]; then
              if command -v rsync >/dev/null 2>&1; then
                mkdir -p $BACKUP_DIR/uploads.latest
                rsync -a --delete public/uploads/ $BACKUP_DIR/uploads.latest/
              else
                rm -rf $BACKUP_DIR/uploads.latest
                cp -r public/uploads $BACKUP_DIR/uploads.latest
              fi
              echo "Uploads backed up"
            else
              echo "No uploads yet"
            fi

            # Wipe the old release, but keep prisma/ and public/
            find . -mindepth 1 -maxdepth 1 ! -name prisma ! -name public -exec rm -rf {} +

            # Inside those two, keep only the data
            [ -d public ] && find public -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} + || true
            [ -d prisma ] && find prisma -mindepth 1 -maxdepth 1 ! -name dev.db -exec rm -rf {} + || true

            mkdir -p public/uploads prisma

      - name: Upload deployment package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "spok-digital-deployment.tar.gz"
          target: "/home/gulfcart/spok-digital/current/"

      - name: Extract and setup application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            APP_NAME="spok-digital"
            DEPLOY_PATH="/home/gulfcart/spok-digital"
            BACKUP_DIR="$DEPLOY_PATH/backups"
            DB_PATH="$DEPLOY_PATH/current/prisma/dev.db"
            UPLOADS_PATH="$DEPLOY_PATH/current/public/uploads"

            cd $DEPLOY_PATH/current

            tar -xzf spok-digital-deployment.tar.gz
            rm spok-digital-deployment.tar.gz

            # Restore the database if it is missing or empty
            if [ ! -s "$DB_PATH" ] && [ -f "$BACKUP_DIR/dev.db.latest" ]; then
              cp "$BACKUP_DIR/dev.db.latest" "$DB_PATH"
              echo "Database restored from backup"
            else
              echo "Existing database kept"
            fi

            # Restore uploads if the folder is empty
            mkdir -p "$UPLOADS_PATH"
            if [ -z "$(ls -A "$UPLOADS_PATH" 2>/dev/null)" ] && [ -d "$BACKUP_DIR/uploads.latest" ]; then
              cp -r "$BACKUP_DIR/uploads.latest/." "$UPLOADS_PATH/"
              echo "Uploads restored from backup"
            else
              echo "Existing uploads kept"
            fi

            # Write .env first so Prisma CLI and npm scripts can read DATABASE_URL
            cat > .env << EOF
            NODE_ENV=production
            PORT=3013
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            DATABASE_URL=file:$DB_PATH
            EOF

            npm ci

            # Create tables on first deploy; refuses destructive changes by default
            npx prisma db push || echo "WARNING: prisma db push failed, check schema"
            npx prisma generate

            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: '$APP_NAME',
                script: 'npm',
                args: 'start',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3013,
                  RESEND_API_KEY: '${{ secrets.RESEND_API_KEY }}',
                  DATABASE_URL: 'file:$DB_PATH'
                }
              }]
            };
            EOF

            pm2 start ecosystem.config.js
            pm2 save

            sudo pm2 startup systemd -u $USER --hp /home/$USER 2>/dev/null || echo "PM2 startup already configured"