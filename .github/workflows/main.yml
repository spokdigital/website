name: Deploy Spok Digital to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Create deployment package
        run: |
          mkdir -p deploy

          # Copy essential files for Next.js production
          cp -r .next deploy/
          cp -r public deploy/
          cp package*.json deploy/
          cp next.config.ts deploy/

          # Copy source files that Next.js might need at runtime
          [ -d "app" ] && cp -r app deploy/ || echo "No app directory"
          [ -d "components" ] && cp -r components deploy/ || echo "No components directory"
          [ -d "lib" ] && cp -r lib deploy/ || echo "No lib directory"
          [ -d "prisma" ] && cp -r prisma deploy/ || echo "No prisma directory"
          [ -f "components.json" ] && cp components.json deploy/ || echo "No components.json"
          [ -f "tailwind.config.ts" ] && cp tailwind.config.ts deploy/ || echo "No tailwind.config.ts"
          [ -f "postcss.config.mjs" ] && cp postcss.config.mjs deploy/ || echo "No postcss.config.mjs"
          [ -f "tsconfig.json" ] && cp tsconfig.json deploy/ || echo "No tsconfig.json"

          # Never ship local data: the server's copies must stay untouched
          rm -rf deploy/public/uploads
          rm -f deploy/prisma/dev.db deploy/prisma/dev.db-journal

          # Create production package
          tar -czf spok-digital-deployment.tar.gz -C deploy .

      # 1) Only make sure the folder exists. The live site is NOT touched yet,
      #    so if the upload fails, the old release keeps running.
      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /home/gulfcart/spok-digital

      # 2) Upload the tarball NEXT TO current/, not into it
      - name: Upload deployment package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "spok-digital-deployment.tar.gz"
          target: "/home/gulfcart/spok-digital/"

      # 3) Only now stop, swap, migrate and start
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e

            APP_NAME="spok-digital"
            DEPLOY_PATH="/home/gulfcart/spok-digital"
            APP_DIR="$DEPLOY_PATH/current"
            PACKAGE="$DEPLOY_PATH/spok-digital-deployment.tar.gz"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Timestamped DB backup, keep the last 5
            if [ -f prisma/dev.db ]; then
              cp prisma/dev.db "$DEPLOY_PATH/dev.db.$(date +%F-%H%M%S).bak"
            else
              echo "No database yet"
            fi
            ls -1t "$DEPLOY_PATH"/dev.db.*.bak 2>/dev/null | tail -n +6 | xargs -r rm -f

            # Stop the app
            pm2 stop $APP_NAME 2>/dev/null || echo "Process not running"
            pm2 delete $APP_NAME 2>/dev/null || echo "Process not found"

            # Wipe the old release, but keep prisma/ and public/
            find . -mindepth 1 -maxdepth 1 ! -name prisma ! -name public -exec rm -rf {} +

            # Inside those two, keep only the data
            [ -d public ] && find public -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} + || true
            [ -d prisma ] && find prisma -mindepth 1 -maxdepth 1 ! -name dev.db -exec rm -rf {} + || true

            mkdir -p public/uploads prisma

            # Extract the new release
            tar -xzf "$PACKAGE" -C "$APP_DIR"
            rm -f "$PACKAGE"

            # .env is the single place for secrets and config
            cat > .env << EOF
            NODE_ENV=production
            PORT=3013
            DATABASE_URL="file:./dev.db"
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EOF
            chmod 600 .env

            npm ci

            # Prisma client + apply schema changes.
            # No --accept-data-loss: if a change would destroy data, the deploy fails loudly.
            npx prisma generate
            npx prisma db push

            # pm2 config (no secrets here, Next.js reads .env itself)
            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: '$APP_NAME',
                cwd: '$APP_DIR',
                script: 'npm',
                args: 'start',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3013
                }
              }]
            };
            EOF

            pm2 start ecosystem.config.js
            pm2 save